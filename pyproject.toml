[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lunes-lti"
version = "0.1.0"
description = "LTI 1.3 connector between learning management systems and the Lunes web app"
readme = "README.md"
license = "Apache-2.0"
# The web host may run an older Debian Python than the development machines (3.12)
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1",
    "PyLTI1p3>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=9"]
# gunicorn does not run on Windows; only installed on the server
deploy = ["gunicorn>=26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lunes_lti = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["keys: generates throwaway RSA keys"]
